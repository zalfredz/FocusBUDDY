[project]
name = "focusbuddy"
version = "5.0.0"
description = "FocusBuddy — pendamping micro-planning harian bersama Kalem"
requires-python = ">=3.13,<3.14"
dependencies = [
  "flet==0.86.4",
  "flet-web==0.86.4",
  "httpx==0.28.1",
  "supabase-auth==2.31.0",
  "pydantic==2.13.4",
  "pydantic-core==2.46.4",
  "cryptography==43.0.1",
  "cffi==2.0.0",
  "numpy==2.4.6",
  "scipy==1.18.0",
  "scikit-learn==1.9.0",
  "joblib==1.5.3",
  "python-dotenv==1.2.2",
  "google-genai>=1.0.0",
  "openai>=1.0.0",
]

[tool.flet]
product = "FocusBuddy"
org = "id.focusbuddy"
bundle_id = "id.focusbuddy.app"
build_number = 1
copyright = "Copyright © 2026 FocusBuddy"

[tool.flet.app]
path = "."
module = "main.py"
exclude = [
  ".env",
  ".env.local",
  ".git",
  ".venv",
  "build",
  "tests",
  "tools",
  "datasets/bpom_products_2026-08-01.csv",
]
